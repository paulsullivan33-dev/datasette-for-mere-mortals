site_name: Datasette for Mere Mortals
site_description: A website and a JSON API from a SQLite file you already have. Serving a database on your own machine, browsing its tables, filtering and searching them, asking questions in SQL, and adding the titles, facets and canned queries that turn a raw file into a small publication, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/datasette-for-mere-mortals/
